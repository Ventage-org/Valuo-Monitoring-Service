# ============================================================
# Valuo Monitoring Service - Application Configuration
# ============================================================
spring.application.name=valuo-monitoring-service
server.port=8082

# ============================================================
# PostgreSQL - db_operacional_valuo
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/db_operacional_valuo
spring.datasource.username=postgres
spring.datasource.password=5432
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=monitoring
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ============================================================
# ML Service Integration
# ============================================================
ml.service.url=http://localhost:8000
ml.service.admin-token=
ml.service.connect-timeout-ms=5000
ml.service.read-timeout-ms=20000

# ============================================================
# Actuator
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ============================================================
# OpenAPI / Swagger
# ============================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ============================================================
# Logging
# ============================================================
logging.level.pe.ventage.valuo=DEBUG
logging.level.org.springframework.web=INFO
